name: AI Evaluation Portfolio CI

on:
  push:
    paths:
      - 'portfolio/handshake-neuroeval/**'
      - 'portfolio/meridial-healthqa/**'
      - '.github/workflows/ai-evaluation-portfolio.yml'
  pull_request:
    paths:
      - 'portfolio/handshake-neuroeval/**'
      - 'portfolio/meridial-healthqa/**'
      - '.github/workflows/ai-evaluation-portfolio.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - portfolio/handshake-neuroeval
          - portfolio/meridial-healthqa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test tools
        working-directory: ${{ matrix.project }}
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: pytest -q
      - name: Run benchmark metrics
        working-directory: ${{ matrix.project }}
        run: python metrics.py
