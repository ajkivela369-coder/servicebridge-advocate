[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "servicebridge-advocate"
version = "0.1.0"
description = "A privacy-first, evidence-grounded AI advocate for medical, veteran, disability-benefit, and accommodation workflows."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ServiceBridge contributors"}]
keywords = ["veterans", "disability", "benefits", "medical-advocacy", "rag", "accessibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
ai = ["openai>=1.100.0"]
documents = ["pypdf>=5.0.0", "python-docx>=1.1.0"]
api = ["fastapi>=0.115.0", "uvicorn>=0.30.0", "pydantic>=2.8.0"]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]
all = [
  "openai>=1.100.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
]

[project.scripts]
servicebridge = "servicebridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]