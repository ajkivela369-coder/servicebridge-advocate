[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroeval"
version = "0.1.0"
description = "Auditable biology and neuroscience AI-response evaluator"
requires-python = ">=3.10"

[project.scripts]
neuroeval = "neuroeval.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
