[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthqa-auditor"
version = "0.1.0"
description = "Safety-first, auditable QA checks for health-science AI outputs"
requires-python = ">=3.10"

[project.scripts]
healthqa = "healthqa.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
